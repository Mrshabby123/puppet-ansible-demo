---
- name: Configure IIS Web Server on Windows
  hosts: windows
  tasks:
    - name: Install IIS Web-Server feature
      ansible.windows.win_feature:
        name: Web-Server
        state: present

    - name: Ensure IIS service is running
      ansible.windows.win_service:
        name: W3SVC
        state: started
        start_mode: auto

    - name: Create a simple index.html page
      ansible.windows.win_copy:
        content: "<h1>Welcome to IIS - Managed by Ansible</h1>"
        dest: "C:\\inetpub\\wwwroot\\index.html"
